<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <title>과제 한눈에 — 전체 마감일</title>
  </head>
  <body>
    <div class="wrap">
      <header class="page-head">
        <div>
          <h1>과제 한눈에</h1>
          <p class="muted" id="status">불러오는 중…</p>
        </div>
        <div class="head-actions">
          <button id="export">캘린더로 내보내기 (.ics)</button>
          <button id="options">설정</button>
          <button id="refresh" class="primary">새로고침</button>
        </div>
      </header>

      <div id="alert" class="banner" hidden></div>

      <section class="stats" id="stats"></section>

      <section class="toolbar">
        <input type="text" id="search" placeholder="과제명 · 과목명 검색" />
        <select id="course"><option value="">전체 과목</option></select>
        <select id="type"><option value="">전체 유형</option></select>
        <label class="check">
          <input type="checkbox" id="hideSubmitted" />
          제출 완료 숨기기
        </label>
        <label class="check">
          <input type="checkbox" id="hideNoDue" />
          기한 없는 항목 숨기기
        </label>
      </section>

      <section id="board"></section>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
